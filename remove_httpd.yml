---

- hosts: all
  become: true
  tasks:

  - name: update repository index
    dnf:
      update_cache: yes

  - name: install httpd package
    dnf:
      name: httpd
      state: absent

  - name: Install PHP and PHP-FPM
    dnf:
      name:
        - php
        - php-fpm
      state: absent  
