---

- hosts: all
  become: true
  tasks:

  - name: install updates (Rocky)
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_facts['distribution'] == "Rocky"

  - name: install updates (Ubuntu)
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_facts['distribution'] == "Ubuntu"


- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php for Ubuntu servers
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
      update_cache: yes
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: install httd and php for Rocky9(RHEL)
    dnf:
      name:
        - httpd
        - php
      state: latest    
    when: ansible_facts['distribution'] == "Rocky"
