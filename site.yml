---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (Rocky)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_facts['distribution'] == "Rocky"

  - name: start httpd (Rocky)
    tags: apache, rocky, httpd
    service:
      name: httpd
      state: started
      enabled: yes
    when: ansible_facts['distribution'] == "Rocky"

  - name: install updates (Ubuntu)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_facts['distribution'] == "Ubuntu"


- hosts: all
  become: true
  tasks:

  - name: create maggie user
    tags: always
    user:
      name: maggie
      groups: root

  - name: add ssh key for maggie
    tags: always
    authorized_key:
      user: maggie
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILyFG0TkYP3mnCaN4x3t8si0OvsD/NXiz29WT4dzoRqp ansible"

  - name: add sudoers file for maggie
    tags: always
    copy:
      src: sudoer_maggie
      dest: /etc/sudoers.d/maggie
      owner: root
      group: root
      mode: 0440  

- hosts: workstations
  become: true
  tasks:

  - name: install unzip package
    package:
      name: unzip
      state: present

  - name: install terraform
    unarchive:
      src: https://releases.hashicorp.com/terraform/0.12.28/terraform_0.12.28_linux_amd64.zip
      dest: /usr/local/bin
      remote_src: yes
      mode: '0755'
      owner: root
      group: root


- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php for Ubuntu servers
    tags: apache,apache2,ubuntu
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
      update_cache: yes
    when: ansible_facts['distribution'] == "Ubuntu"

  - name: install httd and php for Rocky9(RHEL)
    tags: apache,rocky,http
    dnf:
      name:
        - httpd
        - php
      state: latest
    when: ansible_facts['distribution'] == "Rocky"

  - name: change e-mail address for admin
    tags: apache,rocky,httpd
    lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin somebody@somehwere.net
    when: ansible_facts['distribution'] == "Rocky"
    register: httpd

  - name: restart httpd(Rocky)
    tags: apache,rocky,httpd
    service:
      name: httpd
      state: restarted
    when: httpd.changed

  - name: copy defaul html file for site
    tags: apache,apache2,httpd
    copy:
      src: default_sites.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: '0644'


- hosts: db_servers
  become: true
  tasks:

  - name: install mariadb package (Rocky)
    tags: rocky,db,mariadb
    dnf:
      name: mariadb
      state: latest
    when: ansible_facts['distribution'] == "Rocky"

  - name: install mariadb package (Ubuntu)
    tags: ubuntu,db,mariadb
    apt:
      name: mariadb-server
      state: latest
    when: ansible_facts['distribution'] == "Ubuntu"


- hosts: file_servers
  become: true
  tasks:

  - name: install samba package
    tags: samba
    package:
      name: samba
      state: latest
